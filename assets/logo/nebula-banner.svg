<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nebula LIB</title>
  <desc id="desc">An animated monochrome orbital grid representing the Nebula LIB Roblox UI framework.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="0.48" stop-color="#171717"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 118) rotate(135) scale(300 360)">
      <stop stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#FFFFFF" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="300" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#fade)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#halo)"/>

    <g opacity="0.75">
      <ellipse cx="974" cy="116" rx="236" ry="72" transform="rotate(-18 974 116)" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <ellipse cx="974" cy="116" rx="196" ry="112" transform="rotate(28 974 116)" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <ellipse cx="974" cy="116" rx="132" ry="164" transform="rotate(67 974 116)" stroke="#FFFFFF" stroke-opacity="0.1"/>
    </g>

    <circle cx="974" cy="116" r="12" fill="#FFFFFF" filter="url(#glow)">
      <animate attributeName="r" values="10;15;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="974" cy="116" r="42" stroke="#FFFFFF" stroke-opacity="0.22">
      <animate attributeName="r" values="32;56;32" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="3s" repeatCount="indefinite"/>
    </circle>

    <g fill="#FFFFFF">
      <circle cx="824" cy="72" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1092" cy="70" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="190" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="864" cy="222" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="-240" y="258" width="360" height="1" fill="#FFFFFF" fill-opacity="0.65">
      <animate attributeName="x" values="-240;1200" dur="5s" repeatCount="indefinite"/>
    </rect>

    <g fill="#FFFFFF">
      <text x="76" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="6" opacity="0.62">ROBLOX LUAU UI FRAMEWORK</text>
      <text x="70" y="182" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="2">NEBULA LIB</text>
      <text x="76" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3" opacity="0.68">BUILD IN DIMENSIONS / SHIP WITH CLARITY</text>
    </g>

    <path d="M70 244H420" stroke="#FFFFFF" stroke-opacity="0.5"/>
    <path d="M70 250H242" stroke="#FFFFFF" stroke-opacity="0.18"/>
  </g>
</svg>